<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b83b0"/>
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2812f"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#ffffff"/>

  <text x="36" y="46" font-size="21" font-weight="600" fill="#1f2937">LPM 查表流水线：两级存储 + 溢出旁路</text>
  <text x="36" y="72" font-size="13" fill="#5b6b7c">目的地址 → 前缀匹配 → 索引 → 桶 → 结果，全程由硬件完成，软件只负责下发时的编码</text>

  <!-- 报文 -->
  <rect x="36" y="148" width="136" height="100" rx="8" fill="#eef4fb" stroke="#2d6cb5" stroke-width="1.6"/>
  <text x="104" y="176" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f2937">报文</text>
  <text x="104" y="198" text-anchor="middle" font-size="13" fill="#1f2937">目的地址</text>
  <text x="104" y="222" text-anchor="middle" font-size="11" fill="#5b6b7c">v4: 32 bit</text>
  <text x="104" y="238" text-anchor="middle" font-size="11" fill="#5b6b7c">v6: 128 bit</text>

  <!-- VRF -->
  <rect x="36" y="300" width="136" height="56" rx="8" fill="#f7fafd" stroke="#9db8d6" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="104" y="324" text-anchor="middle" font-size="13.5" fill="#1f2937">VRF ID</text>
  <text x="104" y="342" text-anchor="middle" font-size="11" fill="#5b6b7c">与目的地址共同构成 key</text>
  <line x1="104" y1="300" x2="104" y2="252" stroke="#5b83b0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- CAM -->
  <line x1="172" y1="198" x2="212" y2="198" stroke="#5b83b0" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="216" y="136" width="196" height="124" rx="8" fill="#dbe9f8" stroke="#2d6cb5" stroke-width="1.8"/>
  <text x="314" y="162" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">CAM 阵列</text>
  <g fill="#ffffff" stroke="#8fb4dd" stroke-width="1">
    <rect x="236" y="174" width="156" height="13" rx="2"/>
    <rect x="236" y="193" width="156" height="13" rx="2"/>
    <rect x="236" y="212" width="156" height="13" rx="2"/>
    <rect x="236" y="231" width="156" height="13" rx="2"/>
  </g>
  <text x="314" y="284" text-anchor="middle" font-size="11.5" fill="#5b6b7c">前缀 key + mask，全表并行比对</text>

  <!-- 索引表 -->
  <line x1="412" y1="198" x2="452" y2="198" stroke="#5b83b0" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="432" y="188" text-anchor="middle" font-size="10.5" fill="#5b6b7c">命中行号</text>

  <rect x="456" y="136" width="92" height="124" rx="8" fill="#eef4fb" stroke="#2d6cb5" stroke-width="1.6"/>
  <text x="502" y="176" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2937">索引表</text>
  <text x="502" y="200" text-anchor="middle" font-size="11" fill="#5b6b7c">槽位 →</text>
  <text x="502" y="216" text-anchor="middle" font-size="11" fill="#5b6b7c">桶指针</text>

  <!-- 桶存储 -->
  <line x1="548" y1="198" x2="592" y2="198" stroke="#5b83b0" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="596" y="136" width="196" height="124" rx="8" fill="#dbe9f8" stroke="#2d6cb5" stroke-width="1.8"/>
  <text x="694" y="162" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">桶存储</text>
  <text x="694" y="186" text-anchor="middle" font-size="11.5" fill="#3f5468">变长表项按桶聚合</text>
  <text x="694" y="206" text-anchor="middle" font-size="11.5" fill="#3f5468">桶内二次精确匹配</text>
  <text x="694" y="226" text-anchor="middle" font-size="11" fill="#5b6b7c">命中即本地完成</text>
  <text x="694" y="242" text-anchor="middle" font-size="11" fill="#5b6b7c">不需要再到下一级</text>

  <!-- 结果 -->
  <line x1="792" y1="198" x2="832" y2="198" stroke="#5b83b0" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="836" y="148" width="100" height="100" rx="8" fill="#e8f3ea" stroke="#3f8f52" stroke-width="1.6"/>
  <text x="886" y="186" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2937">下一跳</text>
  <text x="886" y="208" text-anchor="middle" font-size="13.5" fill="#1f2937">出接口</text>

  <!-- 溢出表 -->
  <line x1="694" y1="260" x2="694" y2="336" stroke="#c2812f" stroke-width="1.6" marker-end="url(#arrowWarn)"/>
  <text x="706" y="322" font-size="10.5" fill="#a9711f">本地未命中</text>

  <rect x="596" y="340" width="196" height="104" rx="8" fill="#fdf3e7" stroke="#c2812f" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="694" y="368" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f2937">溢出表（远端）</text>
  <text x="694" y="392" text-anchor="middle" font-size="11.5" fill="#3f5468">承接更深的残差前缀</text>
  <text x="694" y="412" text-anchor="middle" font-size="11.5" fill="#3f5468">容量更充裕，访问更慢</text>
  <text x="694" y="432" text-anchor="middle" font-size="11" fill="#a9711f">仅允许一次跳转</text>

  <path d="M 792 392 L 886 392 L 886 252" fill="none" stroke="#c2812f" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowWarn)"/>
  <text x="826" y="384" text-anchor="middle" font-size="10.5" fill="#a9711f">命中返回</text>

  <!-- 底部原则 -->
  <line x1="36" y1="474" x2="924" y2="474" stroke="#dde5ee" stroke-width="1"/>
  <text x="36" y="500" font-size="12" fill="#3f5468">前缀越深，走的级数越多；浅前缀在第一级就出结果。</text>
  <text x="36" y="522" font-size="12" fill="#3f5468">每一级都按“先写下级、再改指针、最后写上级”的顺序提交，保证中间状态仍可正确查表（hitless）。</text>
  <text x="36" y="544" font-size="12" fill="#3f5468">容量自左向右递增、速度依次递减，资源编排就是在“命中率”和“占用”之间找平衡。</text>
</svg>
