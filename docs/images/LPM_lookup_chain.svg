<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950" font-family="Segoe UI, Microsoft YaHei, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4D4D4D"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6C8EBF"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="850" y="130.208" font-size="20.8333" font-weight="bold" fill="#1F1F1F" text-anchor="middle">LPM 硬件查表链路（Lookup Pipeline）</text><text x="850" y="150.347" font-size="13.8889" font-weight="normal" fill="#595959" text-anchor="middle">硬件自动完成 · 最长前缀匹配 · 前缀越深，走的级数越多</text><rect x="30" y="205" width="220" height="190" rx="6" fill="#F5F5F5" stroke="#666666" stroke-width="2"/><text x="140" y="237.153" font-size="15.2778" font-weight="bold" fill="#1F1F1F" text-anchor="middle">提取查表 Key</text><text x="140" y="254.271" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">报文目的 IP</text><text x="140" y="271.389" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">VRF ID</text><text x="140" y="288.507" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">v4: 32 bit</text><text x="140" y="305.625" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">v6: 128 bit</text><rect x="300" y="205" width="220" height="190" rx="6" fill="#FFE6CC" stroke="#D79B00" stroke-width="2"/><text x="410" y="237.153" font-size="15.2778" font-weight="bold" fill="#1F1F1F" text-anchor="middle">TCAM 前缀匹配</text><text x="410" y="254.271" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">6144 行 = 3 bank × 2048</text><text x="410" y="271.389" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">存 /N 前缀 key + mask</text><text x="410" y="288.507" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">全表硬件并行比对</text><text x="410" y="305.625" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">最长前缀优先</text><text x="410" y="322.743" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">→ 输出 SRAM1 cell 索引</text><rect x="570" y="205" width="220" height="190" rx="6" fill="#D5E8D4" stroke="#82B366" stroke-width="2"/><text x="680" y="237.153" font-size="15.2778" font-weight="bold" fill="#1F1F1F" text-anchor="middle">SRAM1 桶索引</text><text x="680" y="254.271" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">6144 行</text><text x="680" y="271.389" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">每 cell ≤ 5 槽（硬约束）</text><text x="680" y="288.507" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">每槽 → 一个</text><text x="680" y="305.625" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">SRAM2 桶指针</text><rect x="840" y="205" width="220" height="190" rx="6" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="2"/><text x="950" y="237.153" font-size="15.2778" font-weight="bold" fill="#1F1F1F" text-anchor="middle">SRAM2 桶内 bcam 匹配</text><text x="950" y="254.271" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">22528 行</text><text x="950" y="271.389" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">本地 F0–F3：1/2/4/5 叶</text><text x="950" y="288.507" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">bcont F4–F6：8/10/15 槽</text><text x="950" y="305.625" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">短前缀 /8 /16 在此直接出结果</text><rect x="1110" y="205" width="220" height="190" rx="6" fill="#E1D5E7" stroke="#9673A6" stroke-width="2"/><text x="1220" y="237.153" font-size="15.2778" font-weight="bold" fill="#1F1F1F" text-anchor="middle">REMOTE 残差匹配</text><text x="1220" y="254.271" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">265216 行（259×1024）</text><text x="1220" y="271.389" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">f0–f3 = 1/2/3/4 叶</text><text x="1220" y="288.507" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">残差位宽 115/44/21/9 bit</text><text x="1220" y="305.625" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">next 链 ≤ 1 跳</text><text x="1220" y="322.743" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">→ ≤ 2 条 / 8 叶上限</text><rect x="1390" y="205" width="260" height="190" rx="6" fill="#FFF2CC" stroke="#D6B656" stroke-width="2"/><text x="1520" y="237.153" font-size="15.2778" font-weight="bold" fill="#1F1F1F" text-anchor="middle">查表结果</text><text x="1520" y="254.271" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">最长前缀命中</text><text x="1520" y="271.389" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">输出 NH / 出接口</text><text x="1520" y="288.507" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">→ 报文转发</text><line x1="250" y1="300" x2="300" y2="300" stroke="#4D4D4D" stroke-width="2" marker-end="url(#arr)"/><rect x="190" y="420" width="170" height="30" fill="white"/><text x="275" y="440" font-size="11.1111" fill="#333333" text-anchor="middle">提取 key</text><line x1="520" y1="300" x2="570" y2="300" stroke="#4D4D4D" stroke-width="2" marker-end="url(#arr)"/><rect x="460" y="420" width="170" height="30" fill="white"/><text x="545" y="440" font-size="11.1111" fill="#333333" text-anchor="middle">命中：cell 索引</text><line x1="790" y1="300" x2="840" y2="300" stroke="#4D4D4D" stroke-width="2" marker-end="url(#arr)"/><rect x="730" y="420" width="170" height="30" fill="white"/><text x="815" y="440" font-size="11.1111" fill="#333333" text-anchor="middle">槽位 → 桶指针</text><line x1="1060" y1="300" x2="1110" y2="300" stroke="#4D4D4D" stroke-width="2" marker-end="url(#arr)"/><rect x="1000" y="420" width="170" height="30" fill="white"/><text x="1085" y="440" font-size="11.1111" fill="#333333" text-anchor="middle">bcont 链（深路由溢出）</text><line x1="1330" y1="300" x2="1390" y2="300" stroke="#4D4D4D" stroke-width="2" marker-end="url(#arr)"/><rect x="1275" y="420" width="170" height="30" fill="white"/><text x="1360" y="440" font-size="11.1111" fill="#333333" text-anchor="middle">命中：输出结果</text><polyline points="950,205 950,175 1520,175 1520,205" fill="none" stroke="#6C8EBF" stroke-width="2" marker-end="url(#arrB)"/><text x="1235" y="165" font-size="11.1111" fill="#333333" text-anchor="middle">本地格式命中（不进 REMOTE）</text><polyline points="300,350 300,840 256,840" fill="none" stroke="#D6B656" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr)"/><line x1="140" y1="395" x2="140" y2="480" stroke="#BFBFBF" stroke-width="1.2" stroke-dasharray="4,4"/><text x="140" y="515.118" font-size="11.8056" font-weight="normal" fill="#595959" text-anchor="middle">查表全程硬件完成</text><text x="140" y="532.236" font-size="11.8056" font-weight="normal" fill="#595959" text-anchor="middle">软件只负责</text><text x="140" y="549.354" font-size="11.8056" font-weight="normal" fill="#595959" text-anchor="middle">下发时的编码</text><line x1="410" y1="395" x2="410" y2="480" stroke="#BFBFBF" stroke-width="1.2" stroke-dasharray="4,4"/><text x="410" y="515.118" font-size="11.8056" font-weight="normal" fill="#595959" text-anchor="middle">硬件并行比对</text><text x="410" y="532.236" font-size="11.8056" font-weight="normal" fill="#595959" text-anchor="middle">与表规模无关 O(1)</text><text x="410" y="549.354" font-size="11.8056" font-weight="normal" fill="#595959" text-anchor="middle">未命中 → default 兜底</text><line x1="680" y1="395" x2="680" y2="480" stroke="#BFBFBF" stroke-width="1.2" stroke-dasharray="4,4"/><text x="680" y="515.118" font-size="11.8056" font-weight="normal" fill="#595959" text-anchor="middle">≤5 槽 = 一个前缀</text><text x="680" y="532.236" font-size="11.8056" font-weight="normal" fill="#595959" text-anchor="middle">最多挂 5 个桶</text><text x="680" y="549.354" font-size="11.8056" font-weight="normal" fill="#595959" text-anchor="middle">（硬约束，软件规划核心）</text><line x1="950" y1="395" x2="950" y2="480" stroke="#BFBFBF" stroke-width="1.2" stroke-dasharray="4,4"/><text x="950" y="515.118" font-size="11.8056" font-weight="normal" fill="#595959" text-anchor="middle">每桶 deep 路由 ~22 条</text><text x="950" y="532.236" font-size="11.8056" font-weight="normal" fill="#595959" text-anchor="middle">（f4–f6 格式）</text><line x1="1220" y1="395" x2="1220" y2="480" stroke="#BFBFBF" stroke-width="1.2" stroke-dasharray="4,4"/><text x="1220" y="515.118" font-size="11.8056" font-weight="normal" fill="#595959" text-anchor="middle">256K 场景仅占 45%</text><text x="1220" y="532.236" font-size="11.8056" font-weight="normal" fill="#595959" text-anchor="middle">remote 最充裕</text><text x="1220" y="549.354" font-size="11.8056" font-weight="normal" fill="#595959" text-anchor="middle">残差位随叶数递减</text><line x1="1520" y1="395" x2="1520" y2="480" stroke="#BFBFBF" stroke-width="1.2" stroke-dasharray="4,4"/><text x="1520" y="515.118" font-size="11.8056" font-weight="normal" fill="#595959" text-anchor="middle">hitless 提交顺序</text><text x="1520" y="532.236" font-size="11.8056" font-weight="normal" fill="#595959" text-anchor="middle">SRAM2 → SRAM1 → TCAM</text><text x="1520" y="549.354" font-size="11.8056" font-weight="normal" fill="#595959" text-anchor="middle">保证中间状态可查</text><rect x="30" y="780" width="220" height="120" rx="6" fill="#FFF2CC" stroke="#D6B656" stroke-width="2" stroke-dasharray="6,4"/><text x="140" y="820.139" font-size="13.8889" font-weight="bold" fill="#1F1F1F" text-anchor="middle">default 表（兜底）</text><text x="140" y="837.257" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">8192 行</text><text x="140" y="854.375" font-size="11.8056" font-weight="normal" fill="#404040" text-anchor="middle">VRF 默认路由</text><text x="560" y="795" font-size="12.5" fill="#595959" text-anchor="start">· 多级串联：前缀越深走的级数越多；本地格式（F0–F3）在 SRAM2 命中即返回，不进 REMOTE；深路由经 bcont 链溢出 REMOTE 做残差匹配</text><text x="560" y="835" font-size="12.5" fill="#595959" text-anchor="start">· 256K 全 /32 压测资源占比：TCAM 42% / SRAM2 46% / REMOTE 45%（remote 最充裕）</text><text x="560" y="875" font-size="12.5" fill="#595959" text-anchor="start">· hitless：增删路由按 SRAM2 → SRAM1 → TCAM 顺序分阶段提交，每个中间状态下硬件查表结果仍正确</text></svg>